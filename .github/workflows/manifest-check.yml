# Fails the PR if llms-full.txt is out of sync with the canonical .md tree.
# Run scripts/generate_llms_manifest.py before committing to fix.
name: Manifest sync check

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "miliarium_profiles/**"
      - "scripts/generate_llms_manifest.py"
      - "llms-full.txt"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate llms-full.txt
        run: python3 scripts/generate_llms_manifest.py

      - name: Fail if llms-full.txt is out of sync
        run: |
          if ! git diff --exit-code llms-full.txt; then
            echo "::error::llms-full.txt is out of sync with the canonical .md tree."
            echo "::error::Run 'python3 scripts/generate_llms_manifest.py' locally and commit the result."
            exit 1
          fi
