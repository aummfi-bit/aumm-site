# Regenerate the aumm-skill references/ tree and push to aummfi-bit/aumm-skill
# on every canon change.
#
# Prerequisites:
#   1. The aummfi-bit/aumm-skill repo exists.
#   2. Repo secret AUMMSKILL is set to a fine-grained PAT (or
#      app token) with contents:write on aummfi-bit/aumm-skill.
#   3. Repo secret AUMMCHATBOT_DISPATCH_TOKEN is set to a fine-grained
#      PAT (or app token) with contents:write on aummfi-bit/aumm-chat-bot
#      to send repository_dispatch after a skill sync.
#
# Until both are in place, this workflow will fail loudly — by design. The
# alternative (silent skip) would mask drift.
name: Publish aumm-skill

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "miliarium_profiles/**"
      - "scripts/generate_llms_manifest.py"
      - "dist/aumm-skill/SKILL.md"
      - "dist/aumm-skill/README.md"
      - ".github/workflows/skill-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: skill-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aumm-site
        uses: actions/checkout@v4
        with:
          path: aumm-site
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout aumm-skill
        uses: actions/checkout@v4
        with:
          repository: aummfi-bit/aumm-skill
          token: ${{ secrets.AUMMSKILL }}
          path: aumm-skill
          fetch-depth: 1

      - name: Generate references/ tree
        working-directory: aumm-site
        run: |
          python3 scripts/generate_llms_manifest.py --skill-out "${{ github.workspace }}/aumm-skill-build"

      - name: Sync SKILL.md, README.md, references/, and .github/ into aumm-skill
        run: |
          set -euo pipefail
          rsync -a --delete "${{ github.workspace }}/aumm-skill-build/references/" aumm-skill/references/
          rsync -a --exclude='references' --exclude='references/**' aumm-site/dist/aumm-skill/ aumm-skill/

      - name: Commit and push if changed
        id: push_skill
        working-directory: aumm-skill
        run: |
          set -euo pipefail
          git config user.name "aumm-skill-sync[bot]"
          git config user.email "aumm-skill-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CANON_SHA="${{ github.sha }}"
          git commit -m "sync: aumm-site@${CANON_SHA:0:7}"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "skill_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch aumm-chat-bot submodule refresh
        if: steps.push_skill.outputs.pushed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AUMMCHATBOT_DISPATCH_TOKEN }}
          repository: aummfi-bit/aumm-chat-bot
          event-type: aumm_skill_updated
          client-payload: >-
            {"source_repo":"aummfi-bit/aumm-site","canon_sha":"${{ github.sha }}","skill_sha":"${{ steps.push_skill.outputs.skill_sha }}"}
